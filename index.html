<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>포모리 — 25분 집중 타이머</title>
    <meta
      name="description"
      content="집중과 휴식을 25분 단위로 끊어가는 포모도로 타이머. 작업 큐, 풀스크린 포커스 모드, 다크 모드를 지원합니다."
    />
    <meta name="theme-color" content="#F9FAFB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1217" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="포모리" />
    <meta name="apple-mobile-web-app-title" content="포모리" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Search Console -->
    <meta name="naver-site-verification" content="5ef14900153bfb7907d77a65d8800c189c25d7ca" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/notification-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="포모리" />
    <meta property="og:title" content="포모리 — 25분 집중 타이머" />
    <meta
      property="og:description"
      content="집중과 휴식을 25분 단위로 끊어가는 포모도로 타이머. 작업 큐, 풀스크린 포커스 모드, 다크 모드 지원."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="포모리 — 포모도로 타이머" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="포모리 — 25분 집중 타이머" />
    <meta
      name="twitter:description"
      content="집중과 휴식을 25분 단위로 끊어가는 포모도로 타이머."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "포모리",
        "url": "https://pomori.kr",
        "applicationCategory": "Productivity",
        "description": "집중과 휴식을 25분 단위로 끊어가는 포모도로 타이머. 작업 큐, 풀스크린 포커스 모드, 다크 모드를 지원합니다.",
        "inLanguage": "ko",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "KRW"
        }
      }
    </script>

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pomodoro-app-v1');
          var theme = null;
          var accent = null;
          if (raw) {
            var parsed = JSON.parse(raw);
            var s = parsed && parsed.state;
            if (s) {
              if (s.theme === 'dark' || s.theme === 'light') theme = s.theme;
              if (
                s.accent === 'blue' ||
                s.accent === 'green' ||
                s.accent === 'indigo' ||
                s.accent === 'amber'
              ) {
                accent = s.accent;
              }
            }
          }
          // 첫 렌더 전에 속성을 세팅해야 React 트리에서 에러가 나도
          // ErrorBoundary 폴백 UI가 사용자 테마/컬러대로 표시됨.
          document.documentElement.setAttribute('data-theme', theme || 'light');
          document.documentElement.setAttribute('data-accent', accent || 'blue');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.setAttribute('data-accent', 'blue');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
